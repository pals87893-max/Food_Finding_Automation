<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leftover Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">🥕</span>
        <h1>Leftover<span>Kitchen</span></h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span id="themeIcon">🌙</span>
        <span id="themeLabel">Dark mode</span>
      </button>
    </header>

    <main class="layout">
      <!-- Automation chat area -->
      <section class="chat-panel" aria-label="Automation chat">
        <div class="panel-header">
          <h2>Chat</h2>
          <p>Tell it what's in your fridge</p>
        </div>
        <div class="chat-log" id="chatLog">
          <div class="msg msg-bot">
            <p>Hi! Tell me what leftover ingredients you have and I'll find recipes that use them.</p>
          </div>
        </div>
        <form class="chat-input" id="chatForm" action="{{ url_for('home') }}" method="POST">
          <input type="text" name=ingredients id="chatInput" placeholder="e.g. rice, eggs, spinach..." autocomplete="off" required>
          <button type="submit" aria-label="Send message">→</button>
        </form>
      </section>

      <!-- Recipe display area -->
      <section class="display-panel" aria-label="Recipe results">
        <div class="panel-header">
          <h2>Recipes</h2>
          <p>Matches will appear here</p>
        </div>
        <div class="results" id="results">
          <div class="empty-state" id="emptyState">
            <p>No recipes yet</p>
            <p class="empty-sub">Add your leftover ingredients in the chat to see matching recipes here.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
